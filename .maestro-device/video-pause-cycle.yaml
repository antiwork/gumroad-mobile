appId: com.GRD.Gumroad
---
# Precondition: purchase page of iOS QA Pack (gp#1427) open via deep link, video paused mid-way from an earlier run.
# open, play ~10s, pause (confirmed progress), leave, reopen -> must resume at the paused spot.
- tapOn: "Watch"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    point: "50%,50%"
- takeScreenshot: v3-open
- tapOn:
    id: "Play/Pause"
- extendedWaitUntil:
    visible: "never-shown"
    timeout: 10000
    optional: true
- tapOn:
    point: "50%,50%"
- tapOn:
    id: "Play/Pause"
- takeScreenshot: v3-paused
- tapOn:
    point: "5%,9%"
- waitForAnimationToEnd:
    timeout: 4000
- tapOn: "Watch"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    point: "50%,50%"
- takeScreenshot: v3-reopen
