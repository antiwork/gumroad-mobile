appId: com.GRD.Gumroad
---
- takeScreenshot: 31-player-open
# Tap-seek to several points on the bar
- repeat:
    times: 3
    commands:
      - tapOn:
          text: "Playback position"
          point: "75%,50%"
      - tapOn:
          text: "Playback position"
          point: "25%,50%"
# Drag-seek (pan) back and forth, including releasing mid-drag and immediately closing
- repeat:
    times: 4
    commands:
      - swipe:
          from: "Playback position"
          direction: RIGHT
          duration: 800
      - swipe:
          from: "Playback position"
          direction: LEFT
          duration: 800
- takeScreenshot: 32-after-seeks
- swipe:
    from: "Playback position"
    direction: RIGHT
    duration: 200
- tapOn: "Minimize player"
- tapOn:
    id: "open-audio-player"
- swipe:
    from: "Playback position"
    direction: LEFT
    duration: 200
- tapOn: "Minimize player"
- tapOn:
    id: "open-audio-player"
- assertVisible: "Playback position"
- tapOn: "Pause"
- takeScreenshot: 33-final
