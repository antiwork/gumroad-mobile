plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.gumroad'
version = '1.0.0'

android {
  namespace "expo.modules.webviewstartup"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Same version react-native-webview brings into the app; the startup API lands in 1.13.
  implementation "androidx.webkit:webkit:1.14.0"
}