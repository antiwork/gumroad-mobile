appId: ${APP_ID}
---
- scrollUntilVisible:
    element: Login
- tapOn: Email
- inputText: ${EMAIL}
- pressKey: enter # The form moves focus to the password field.
# The password field rerenders after each character in Safari on iOS 26,
# so refocus it before entering each character of the seeded test password.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: Show password
      - tapOn: Password
      - inputText: p
      - tapOn:
          text: Never for This Website
          optional: true
      - tapOn: Password
      - inputText: a
      - tapOn: Password
      - inputText: s
      - tapOn: Password
      - inputText: s
      - tapOn: Password
      - inputText: w
      - tapOn: Password
      - inputText: o
      - tapOn: Password
      - inputText: r
      - tapOn: Password
      - inputText: d
- runFlow:
    when:
      platform: Android
    commands:
      - inputText: ${PASSWORD}
- hideKeyboard
# The password prompt may appear as soon as the form auto-submits.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: Not Now
          optional: true
- runFlow:
    when:
      visible: Login
    commands:
      - tapOn: Login
# Or it may appear after an explicit submit.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: Not Now
          optional: true
