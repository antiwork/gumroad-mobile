appId: ${APP_ID}
---
# The seeded "Mobile Test Video" fixture is 10 seconds long. Positions asserted here have to sit
# above the 3-second minimum the app will save and below the end, past which a finished video
# deliberately restarts from the beginning. Check the fixture duration before widening them.
#
# This flow runs against a shared seeded account that other flows also watch this video on, so it
# cannot assume a starting position. It normalises first by playing to the end, which is what makes
# the next open start at a known 0:00.
- runFlow:
    file: utils/sign-in.yaml
    env:
      EMAIL: mobile_buyer_do_not_edit@gumroad.com
      PASSWORD: password
- tapOn: ".*Mobile Test Product 1.*"
- extendedWaitUntil:
    visible: Mobile Test Video
    timeout: 30000
- tapOn: "Watch|Watch again"
- extendedWaitUntil:
    visible:
      id: video-player
    timeout: 20000
- assertNotVisible: This video failed to load
# Normalise: play through to the end, whatever position this account was left on.
- extendedWaitUntil:
    visible: "Video playback started, 0:(09|10) of 0:10"
    timeout: 30000
- runFlow:
    file: utils/back.yaml
# A finished video restarts from the beginning rather than seeking to the end and stopping.
- tapOn: "Watch|Watch again"
- extendedWaitUntil:
    visible:
      id: video-player
    timeout: 20000
- extendedWaitUntil:
    visible: "Video playback (started|waiting), 0:0[0-3] of 0:10"
    timeout: 20000
# Watch far enough in that the position is worth saving, then leave.
- extendedWaitUntil:
    visible: "Video playback started, 0:0[5-7] of 0:10"
    timeout: 20000
- runFlow:
    file: utils/back.yaml
- runFlow:
    file: utils/relaunch.yaml
- tapOn: Library
- tapOn: ".*Mobile Test Product 1.*"
- extendedWaitUntil:
    visible: Mobile Test Video
    timeout: 45000
- tapOn: "Watch|Watch again"
- extendedWaitUntil:
    visible:
      id: video-player
    timeout: 20000
# The saved position has to be read back. Before this was fixed the player always opened at 0:00.
- extendedWaitUntil:
    visible: "Video playback (started|waiting), 0:0[5-9] of 0:10"
    timeout: 20000
- assertNotVisible: "Video playback (started|waiting), 0:0[0-3] of 0:10"
- assertNotVisible: This video failed to load
