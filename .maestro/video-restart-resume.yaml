appId: ${APP_ID}
---
# The seeded "Mobile Test Video" fixture is 10 seconds long. Positions asserted here have to sit
# above the 3-second minimum the app will save and below the end, past which a finished video
# deliberately restarts from the beginning. Check the fixture duration before widening them.
#
# The app publishes the playback position to the accessibility tree only while a screen reader is
# enabled, so every position below is read off the native ExoPlayer controller instead: one tap on
# the video surface brings the controller up, it stays up for about five seconds, and its position
# text sits in the tree while it is up. Revealing the controller costs a few seconds of playback,
# which is why the windows below are a little wider than the positions they pin down.
#
# This flow runs against a shared seeded account that other flows also watch this video on, so it
# cannot assume a starting position. It normalises first by playing to the end, which is what makes
# the next open start at a known 0:00.
- runFlow:
    file: utils/sign-in.yaml
    env:
      EMAIL: mobile_buyer_do_not_edit@gumroad.com
      PASSWORD: password
- tapOn: ".*Mobile Test Product 1.*"
- extendedWaitUntil:
    visible: Mobile Test Video
    timeout: 30000
- tapOn: "Watch|Watch again"
- extendedWaitUntil:
    visible:
      id: video-player
    timeout: 20000
- assertNotVisible: This video failed to load
# Normalise: play through to the end, whatever position this account was left on.
- tapOn:
    point: "1%,1%"
    repeat: 3
    delay: 7000
- tapOn:
    id: ".*surface_player_view"
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    visible:
      id: ".*exo_position"
      text: "00:10"
    timeout: 10000
- runFlow:
    file: utils/back.yaml
# A finished video restarts from the beginning rather than seeking to the end and stopping.
- tapOn: "Watch|Watch again"
- extendedWaitUntil:
    visible:
      id: video-player
    timeout: 20000
- tapOn:
    id: ".*surface_player_view"
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    visible:
      id: ".*exo_position"
      text: "00:0[0-6]"
    timeout: 10000
# Watch far enough in that the position is worth saving, then leave.
- tapOn:
    point: "1%,1%"
    repeat: 2
    delay: 3000
- runFlow:
    file: utils/back.yaml
- runFlow:
    file: utils/relaunch.yaml
- tapOn: Library
- tapOn: ".*Mobile Test Product 1.*"
- extendedWaitUntil:
    visible: Mobile Test Video
    timeout: 45000
- tapOn: "Watch|Watch again"
- extendedWaitUntil:
    visible:
      id: video-player
    timeout: 20000
- tapOn:
    id: ".*surface_player_view"
    waitToSettleTimeoutMs: 1000
# The saved position has to be read back. Before this was fixed the player always opened at 0:00.
- extendedWaitUntil:
    visible:
      id: ".*exo_position"
      text: "00:(0[8-9]|10)"
    timeout: 10000
- assertNotVisible:
    id: ".*exo_position"
    text: "00:0[0-5]"
- assertNotVisible: This video failed to load
