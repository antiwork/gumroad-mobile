appId: ${APP_ID}
---
- runFlow:
    file: utils/sign-in.yaml
    env:
      EMAIL: mobile_seller1_do_not_edit@gumroad.com
      PASSWORD: password

- tapOn: Agent
- extendedWaitUntil:
    visible:
      text: "Message"
      enabled: true
    timeout: 15000
- evalScript: ${output.scrollTarget = "SCROLL_TARGET_" + Date.now()}
- evalScript: ${output.replyMarker = "SCROLL_REPLY_" + Date.now()}

- tapOn:
    text: "Message"
    enabled: true
- inputText: ${"List my products in detail. " + output.scrollTarget}
- tapOn: "Send"
- extendedWaitUntil:
    visible:
      text: "Message"
      enabled: true
    timeout: 30000

- tapOn:
    text: "Message"
    enabled: true
- inputText: ${"Give me a detailed sales breakdown with revenue, quantity, refunds, average price, conversion rate, and a product-by-product comparison for every product in my store. Include each product name, its recent trend, strongest week, weakest week, and the follow-up questions I should ask. Keep the response detailed so I can review it while it streams. End your reply with the exact marker " + output.replyMarker + " with no formatting."}
- tapOn: "Send"
- extendedWaitUntil:
    visible:
      id: "agent-streaming-reply"
    timeout: 30000
- assertNotVisible:
    id: "agent-user-message"
    containsDescendants:
      - text: ".*${output.scrollTarget}.*"
- scrollUntilVisible:
    element:
      id: "agent-user-message"
      containsDescendants:
        - text: ".*${output.scrollTarget}.*"
    direction: UP
    timeout: 20000
- assertVisible:
    text: "Message"
    enabled: false
- copyTextFrom:
    id: "agent-send-progress"
- evalScript: ${output.replyLengthAfterScroll = Number(maestro.copiedText.match(/[0-9]+/)[0])}
- extendedWaitUntil:
    visible:
      id: "agent-send-progress"
      text: ${"Send.*Assistant response (?!" + output.replyLengthAfterScroll + " characters)[0-9]+ characters"}
    timeout: 30000
- copyTextFrom:
    id: "agent-send-progress"
- evalScript: ${output.replyLengthAfterGrowth = Number(maestro.copiedText.match(/[0-9]+/)[0])}
- assertTrue:
    condition: ${output.replyLengthAfterGrowth > output.replyLengthAfterScroll}
    label: "Assistant reply grows after the reader scrolls up"
- assertVisible:
    id: "agent-user-message"
    containsDescendants:
      - text: ".*${output.scrollTarget}.*"
- extendedWaitUntil:
    visible:
      text: "Message"
      enabled: true
    timeout: 30000
- assertVisible:
    id: "agent-user-message"
    containsDescendants:
      - text: ".*${output.scrollTarget}.*"
- scrollUntilVisible:
    element:
      id: "agent-assistant-message-content"
      text: "(?s).*${output.replyMarker}.*"
    direction: DOWN
    timeout: 20000

- tapOn:
    text: "Message"
    enabled: true
- inputText: "Thanks"
- tapOn: "Send"
- extendedWaitUntil:
    visible:
      text: "Message"
      enabled: false
    timeout: 15000
- assertVisible:
    id: "agent-user-message"
    containsDescendants:
      - text: "Thanks"
- extendedWaitUntil:
    visible:
      text: "Message"
      enabled: true
    timeout: 30000
