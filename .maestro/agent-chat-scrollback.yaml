appId: ${APP_ID}
---
- runFlow:
    file: utils/sign-in.yaml
    env:
      EMAIL: mobile_seller1_do_not_edit@gumroad.com
      PASSWORD: password

- tapOn: Agent
- extendedWaitUntil:
    visible:
      text: "Message"
      enabled: true
    timeout: 15000

- tapOn:
    text: "Message"
    enabled: true
- inputText: "List my products in detail"
- tapOn: "Send"
- extendedWaitUntil:
    visible:
      text: "Message"
      enabled: true
    timeout: 30000

- tapOn:
    text: "Message"
    enabled: true
- inputText: "Give me a detailed sales breakdown"
- tapOn: "Send"
- extendedWaitUntil:
    visible:
      text: "Message"
      enabled: false
    timeout: 15000
- scrollUntilVisible:
    element: "List my products in detail"
    direction: UP
    timeout: 20000
- assertVisible:
    text: "Message"
    enabled: false
- extendedWaitUntil:
    visible:
      text: "Message"
      enabled: true
    timeout: 30000
- assertVisible: "List my products in detail"

- tapOn:
    text: "Message"
    enabled: true
- inputText: "Thanks"
- tapOn: "Send"
- assertVisible: "Thanks"
- extendedWaitUntil:
    visible:
      text: "Message"
      enabled: true
    timeout: 30000
