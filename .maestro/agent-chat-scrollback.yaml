appId: ${APP_ID}
---
- runFlow:
    file: utils/sign-in.yaml
    env:
      EMAIL: mobile_seller1_do_not_edit@gumroad.com
      PASSWORD: password

- tapOn: Agent
- extendedWaitUntil:
    visible:
      text: "Message"
      enabled: true
    timeout: 15000

- tapOn:
    text: "Message"
    enabled: true
- inputText: "List my products in detail"
- tapOn: "Send"
- extendedWaitUntil:
    visible:
      text: "Message"
      enabled: true
    timeout: 30000

- tapOn:
    text: "Message"
    enabled: true
- inputText: "Give me a detailed sales breakdown with revenue, quantity, refunds, average price, conversion rate, and a product-by-product comparison for every product in my store. Include each product name, its recent trend, strongest week, weakest week, and the follow-up questions I should ask. Keep the response detailed so I can review it while it streams."
- tapOn: "Send"
- extendedWaitUntil:
    visible:
      id: "agent-streaming-reply"
    timeout: 30000
- assertNotVisible: "List my products in detail"
- scrollUntilVisible:
    element: "List my products in detail"
    direction: UP
    timeout: 20000
- assertVisible:
    text: "Message"
    enabled: false
- copyTextFrom:
    id: "agent-streaming-reply"
- evalScript: ${output.replyAfterScroll = maestro.copiedText}
- extendedWaitUntil:
    visible:
      text: "Message"
      enabled: true
    timeout: 30000
- assertVisible: "List my products in detail"
- copyTextFrom:
    id: "agent-assistant-message-content"
    index: 2
- evalScript: ${output.completedReply = maestro.copiedText}
- assertTrue:
    condition: ${output.completedReply.length > output.replyAfterScroll.length}
    label: "Assistant reply grows after the reader scrolls up"

- tapOn:
    text: "Message"
    enabled: true
- inputText: "Thanks"
- tapOn: "Send"
- extendedWaitUntil:
    visible:
      text: "Message"
      enabled: false
    timeout: 15000
- assertVisible:
    id: "agent-user-message"
    containsDescendants:
      - text: "Thanks"
- extendedWaitUntil:
    visible:
      text: "Message"
      enabled: true
    timeout: 30000
