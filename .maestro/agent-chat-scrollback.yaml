appId: ${APP_ID}
---
- runFlow:
    file: utils/sign-in.yaml
    env:
      EMAIL: mobile_seller1_do_not_edit@gumroad.com
      PASSWORD: password

- tapOn: ".*Agent.*"
- extendedWaitUntil:
    visible:
      id: "agent-message-input-ready"
    timeout: 15000
- evalScript: ${output.scrollTarget = "SCROLL_TARGET_" + Date.now()}
- evalScript: ${output.replyMarker = "SCROLL_REPLY_" + Date.now()}

- tapOn:
    id: "agent-message-input-ready"
- inputText: ${"Write 10 short paragraphs. Include " + output.scrollTarget + ". End with " + output.replyMarker}
- extendedWaitUntil:
    visible:
      text: "Send"
      enabled: true
    timeout: 5000
- tapOn:
    text: "Send"
    enabled: true
    waitToSettleTimeoutMs: 100
- extendedWaitUntil:
    visible:
      id: "agent-message-input-sending"
    timeout: 5000
- extendedWaitUntil:
    notVisible:
      id: "agent-user-message-content"
      text: ".*${output.scrollTarget}.*"
    timeout: 30000
- swipe:
    start: "50%,35%"
    end: "50%,80%"
    duration: 600
    waitToSettleTimeoutMs: 100
- swipe:
    start: "50%,35%"
    end: "50%,80%"
    duration: 600
    waitToSettleTimeoutMs: 100
- swipe:
    start: "50%,35%"
    end: "50%,80%"
    duration: 600
    waitToSettleTimeoutMs: 100
- extendedWaitUntil:
    visible:
      id: "agent-user-message-content"
      text: ".*${output.scrollTarget}.*"
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "agent-message-input-ready"
    timeout: 90000
- assertVisible:
    id: "agent-user-message-content"
    text: ".*${output.scrollTarget}.*"
